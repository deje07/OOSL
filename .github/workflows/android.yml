name: OOSL debug
on:
  push:
    branches: [oosl]
  pull_request:
    branches: [oosl]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java for SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-33' 'build-tools;30.0.3'
      - name: Set up JDK 11 for the launcher build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Build debug APK
        run: bash ./gradlew assembleAospWithQuickstepOmegaDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: OOSL-debug
          path: build/outputs/apk/aospWithQuickstepOmega/debug/*.apk
          if-no-files-found: error
